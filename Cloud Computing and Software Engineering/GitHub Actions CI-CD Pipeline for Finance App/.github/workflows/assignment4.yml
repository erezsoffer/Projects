name: assignment4

on:
  workflow_dispatch:  # This triggers the workflow manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest  # The job will run on the latest Ubuntu environment
    steps:
      - name: Checkout repository  # Checks out the code from the repository to the GitHub runner
        uses: actions/checkout@v4

      - name: Set up Docker  # Installs Docker Compose on the runner to manage containerized services
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Initialize log file  # Creates a log file for tracking build information and errors
        run: |
          echo "$(date -Iminutes)" > log.txt
          echo "Erez Soffer" >> log.txt
          echo "image not able to be built" >> log.txt

      - name: Build Docker images  # Builds Docker images for the services defined in docker-compose.yml
        run: |
          docker-compose build

      - name: Upload log if build fails  # Uploads the log file if the build step fails
        if: failure()  # Only runs this step if the previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: log.txt

  test:
    needs: build  # This job depends on the successful completion of the 'build' job
    runs-on: ubuntu-latest  # Runs on the latest Ubuntu environment
    steps:
      - name: Checkout repository  # Checks out the code from the repository again for the test job
        uses: actions/checkout@v4

      - name: Set up Docker  # Installs Docker Compose again to manage the services
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services  # Starts up the containers defined in docker-compose.yml in detached mode
        run: |
          docker-compose up -d

      - name: Create full log file  # Initializes the log with build success information
        run: |
          echo "$(date -Iminutes)" > log.txt
          echo "Erez Soffer" >> log.txt
          echo "image successfully built" >> log.txt
          echo "Container up and running" >> log.txt

      - name: Run tests  # Runs the automated tests using pytest and captures results
        run: |
          pip install pytest requests
          pytest -v tests/assn4_tests.py | tee assn4_test_results.txt

      - name: Log test results  # Logs whether tests succeeded or failed
        run: |
          if grep -q "failed" assn4_test_results.txt; then
            echo "tests failed" >> log.txt
          else
            echo "tests succeeded" >> log.txt
          fi

      - name: Upload log and test results  # Uploads the log and test results files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test_results
          path: |
            assn4_test_results.txt
            log.txt

  query:
    needs: test  # This job depends on the successful completion of the 'test' job
    runs-on: ubuntu-latest  # Runs on the latest Ubuntu environment
    steps:
      - name: Checkout repository  # Checks out the code from the repository again for the query job
        uses: actions/checkout@v4

      - name: Set up Docker  # Installs Docker Compose again to manage the services
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services  # Starts the containers defined in docker-compose.yml in detached mode
        run: |
          docker-compose up -d

      - name: Wait for stocks service to be ready  # Ensures the stocks service is ready before proceeding
        run: |
          echo "Waiting for stocks service to be ready..."
          until curl --silent --fail http://localhost:5001/stocks; do
            echo "Waiting for stocks service..."
            sleep 5
          done
          echo "Stocks service is up!"

      - name: Execute process_queries.py  # Executes the Python script that processes queries
        run: |
          python process_queries.py

      - name: Upload response file  # Uploads the response file generated by the query process
        uses: actions/upload-artifact@v4
        with:
          name: query_responses
          path: response.txt
